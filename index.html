<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2b5c9e">
<title>维克多背单词</title>
<style>
:root{
  /* 「C 玻璃渐变·淡蓝」主题令牌（引用 ai-wrong-question-review） */
  --radius:16px;
  --primary:#4a7db5; --primary-d:#35618f; --primary-l:#e2f0fc;
  --primary-g:linear-gradient(135deg,#4a7db5,#7ba6d0);
  --accent:#c2594e; --green:#1f9d6b; --bg:#f3f8fd; --card:#fff;
  --text:#27384a; --muted:#61758b; --line:rgba(148,180,210,.32);
  --ring:#7ba6d0; --glass:rgba(255,255,255,.74);
  --shadow:0 8px 28px rgba(70,115,160,.12);
  --tabbar-h:64px; --sidebar-w:224px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);line-height:1.55;padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  background-color:var(--bg);
  background-image:
    radial-gradient(1100px 700px at 6% -10%,rgba(255,255,255,.92),transparent 62%),
    radial-gradient(900px 620px at 100% 0%,rgba(196,222,245,.45),transparent 60%),
    radial-gradient(900px 700px at 50% 112%,rgba(214,232,247,.42),transparent 62%),
    linear-gradient(135deg,#f3f8fd 0%,#e9f2fb 50%,#f7fafd 100%);
  background-attachment:fixed;background-repeat:no-repeat}
/* 全站统一的焦点可见、悬停、减少动效 */
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
@media (hover:hover){
  .btn:not(:disabled):hover{filter:brightness(1.06)}
  .tag-chip:hover,.nav-item:hover{filter:brightness(.98)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
/* 页眉：随页面滚走（非固定），标题居左、版本号居右；玻璃渐变淡蓝 */
header{background:var(--primary-g);color:#fff;padding:14px 18px 13px;
  box-shadow:0 6px 20px rgba(74,125,181,.3);
  display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
header h1 .brand-mark{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.22);
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
  border:1px solid rgba(255,255,255,.3)}
.version-mini{font-size:10.5px;padding:3px 9px;border-radius:9px;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.28);font-weight:700;letter-spacing:.3px;flex-shrink:0}

/* ---------- 桌面端左侧导航（≥1024px 显示，手机端隐藏） ---------- */
.sidebar{display:none;position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:35;
  flex-direction:column;padding:22px 14px;background:var(--glass);border-right:1px solid var(--border,rgba(148,180,210,.32));
  -webkit-backdrop-filter:blur(16px) saturate(125%);backdrop-filter:blur(16px) saturate(125%);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.6)}
.side-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;padding:4px 8px 24px;color:var(--text)}
.side-brand .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary-g);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:16px;
  box-shadow:0 6px 16px rgba(74,125,181,.3)}
.sidebar .side-nav{display:flex;flex-direction:column;gap:4px}
.sidebar .side-nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;
  min-height:46px;padding:11px 14px;border:none;border-radius:12px;background:transparent;
  color:var(--muted);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left}
.sidebar .side-nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.sidebar .side-nav button:hover{background:rgba(226,240,252,.7);color:var(--primary)}
.sidebar .side-nav button.active{background:var(--primary-g);color:#fff;
  box-shadow:0 6px 16px rgba(74,125,181,.28)}
.sidebar .side-nav .side-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;
  min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 5px}
.sidebar .side-nav .side-badge.show{display:inline-flex}
.sidebar .side-nav button.active .side-badge{background:rgba(255,255,255,.28)}
.side-foot{margin-top:auto;padding:14px 8px 2px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);text-align:center}
.side-foot b{color:var(--primary);font-weight:800}

/* ---------- 版本记录（设置页内） ---------- */
.version-card{background:var(--card);border-radius:12px;padding:11px 13px;margin-top:16px;
  box-shadow:var(--shadow);border:1px solid var(--line)}
.version-head{display:flex;align-items:center;gap:8px;cursor:pointer}
.version-badge{background:var(--primary-g);color:#fff;font-size:12px;font-weight:800;
  padding:2px 9px;border-radius:8px;letter-spacing:.3px}
.version-date{font-size:11px;color:var(--muted);flex:1}
.version-toggle{font-size:11px;color:var(--primary);font-weight:600;white-space:nowrap}
.version-latest{margin-top:7px}
.vitem{font-size:12px;color:var(--text);line-height:1.6;padding-left:2px}
.version-history{display:none;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.version-history.open{display:block}
.vrel{margin-bottom:9px;font-size:11px}
.vrel-v{font-weight:800;color:var(--primary-d)}
.vrel-date{color:var(--muted);margin-left:6px}
.vrel-items{color:var(--muted);line-height:1.6;margin-top:2px}

.page{display:none;padding:16px 14px 10px;max-width:640px;margin:0 auto}
.page.active{display:block}

/* ---------- 扫描页 ---------- */
.upload-zone{background:var(--glass);border:2px dashed rgba(148,180,210,.55);border-radius:var(--radius);
  padding:34px 18px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.82),var(--shadow);transition:.2s;
  -webkit-backdrop-filter:blur(16px) saturate(125%);backdrop-filter:blur(16px) saturate(125%)}
.upload-zone.drag{border-color:var(--primary);background:var(--primary-l)}
.upload-icon{width:58px;height:58px;margin:0 auto 12px;background:var(--primary-l);
  border-radius:50%;display:flex;align-items:center;justify-content:center}
.upload-icon svg{width:30px;height:30px;stroke:var(--primary)}
.upload-zone h2{font-size:16px;margin:0 0 6px}
.upload-zone p{font-size:13px;color:var(--muted);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;
  border-radius:11px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;
  transition:.15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:var(--primary-l);color:var(--primary)}
.btn-accent{background:var(--primary-g);color:#fff;box-shadow:0 6px 18px rgba(74,125,181,.28)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:9px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
input[type=file]{display:none}

.preview-box{margin-top:16px;background:var(--card);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);display:none}
.preview-box.show{display:block}
.preview-box img{width:100%;max-height:320px;object-fit:contain;display:block;background:#eef1f5}
.preview-meta{padding:12px 14px;font-size:13px;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;gap:8px}

.progress{margin-top:16px;display:none}
.progress.show{display:block}
.progress-bar{height:8px;background:#e3e8f0;border-radius:8px;overflow:hidden}
.progress-bar i{display:block;height:100%;width:0;background:var(--primary-g);
  border-radius:8px;transition:width .4s}
.progress-label{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}

.result-card{margin-top:16px;background:var(--card);border-radius:14px;padding:16px;
  box-shadow:var(--shadow);display:none}
.result-card.show{display:block}
.result-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--green);font-size:15px}
.result-stats{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.result-stats span{background:var(--primary-l);color:var(--primary);font-size:12px;
  padding:4px 10px;border-radius:8px}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#f0f3f8;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--primary-d)}

.hint{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.7}
.hint b{color:var(--text)}

/* ---------- 词库页（仿书本 · 单列无限滚动） ---------- */
/* 表头：搜索框 + 统计 同一行 */
/* 搜索框行：滚动吸顶（页眉滚走后锁在屏幕顶部），列表继续滚动 */
.words-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;
  position:sticky;top:0;z-index:19;background:var(--bg);
  padding:8px 0;margin-top:-8px}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:9px 12px 9px 36px;
  font-size:14px;background:var(--card);box-shadow:var(--shadow);font-family:inherit;outline:none}
.search-wrap input:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(123,166,208,.28)}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--muted)}

/* 标签快捷筛选（收紧） */
.tag-filter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.tag-chip{border:1px solid var(--line);background:var(--card);border-radius:14px;
  min-height:32px;padding:5px 13px;font-size:11.5px;font-family:inherit;cursor:pointer;color:var(--muted);
  display:inline-flex;align-items:center;gap:4px;transition:.15s}
.tag-chip .dot{width:7px;height:7px;border-radius:50%}
.tag-chip.active{border-color:transparent;color:#fff;font-weight:700}
.tag-chip.active[data-tag="__all__"]{background:var(--primary-d)}
.tag-chip.active[data-tag="不会"]{background:#dc2626}
.tag-chip.active[data-tag="不熟"]{background:#ea580c}
.tag-chip.active[data-tag="已掌握"]{background:#16a34a}
.tag-chip.active:not([data-tag="__all__"]):not([data-tag="不会"]):not([data-tag="不熟"]):not([data-tag="已掌握"]){background:#7c3aed}

.list-summary{font-size:13px;color:var(--muted);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.list-summary b{color:var(--primary-d);font-size:17px;font-weight:800}
.list-summary .frac-sep{color:#b9c0cc;margin:0 2px;font-size:14px}

/* 书本纸张风格容器 */
.book-list{background:linear-gradient(#fffdf8,#fffaf0);border:1px solid #e9dfc8;
  border-radius:10px;padding:2px 12px;box-shadow:0 2px 14px rgba(90,70,30,.07)}
.scroll-sentinel{text-align:center;color:var(--muted);font-size:12px;padding:14px 0 4px;min-height:20px}
.scroll-sentinel.hidden{display:none}

/* 词条：词头一行（深蓝加粗）+ 音标斜体（压紧排版） */
.word-card{border-bottom:1px solid #ece2cc;padding:6px 2px}
.word-card:last-child{border-bottom:none}
.word-hd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;cursor:pointer;position:relative}
.word-hd:active{opacity:.7}
.word-name{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:800;
  color:#1d3f7a;letter-spacing:.2px}
.word-ph{font-family:Georgia,serif;color:#8a7f6d;font-size:12px;font-style:italic}
.word-def{flex:1;font-size:12px;color:#7a6f5c;text-align:right;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.level{font-size:10px;color:#6b21a8;background:#f3e8ff;padding:1px 6px;border-radius:6px}
.arrow{width:12px;stroke:#b0a58f;transition:transform .2s;flex-shrink:0;align-self:center}
.word-card.open .arrow{transform:rotate(90deg)}
.word-body{display:none;padding:4px 0 4px 8px}
.word-card.open .word-body{display:block}

/* 学习标签徽标（词头旁，不同颜色） */
.study-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap}
.study-tag.不会{background:#fee2e2;color:#b91c1c}
.study-tag.不熟{background:#ffedd5;color:#c2410c}
.study-tag.已掌握{background:#dcfce7;color:#15803d}
.study-tag.custom{background:#ede9fe;color:#6d28d9}

/* 义项：实心圆序号 + 彩色词性 */
.sense{padding:5px 0 2px;border-bottom:1px dashed #e6dcc4}
.sense:last-child{border-bottom:none}
.sense-hd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.no{width:17px;height:17px;background:#1d3f7a;color:#fff;border-radius:50%;
  font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.pos{color:#c0392b;font-style:italic;font-size:12px;font-weight:700}
.def{font-weight:600;font-size:13px;color:#243247}
.tag{font-size:10px;padding:1px 6px;border-radius:7px}
.tag-count{background:#e0e7ff;color:#3730a3}
.tag-usage{background:#fef3c7;color:#92400e}
.tag-anto{background:#dcfce7;color:#166534}
/* v2 新增：身份符号 / 词频 / 派生 / 义项频次 / 英释 / 蓝底标签框 */
.no-high{background:#dc2626}            /* 高频义：深红实心序号 */
.no-low{background:#fca5a5;color:#7f1d1d} /* 低频义：浅色序号 */
.tag-freq{background:#fee2e2;color:#b91c1c}
.tag-identity{font-weight:700}
.id-\*{background:#f1f5f9;color:#475569}
.id-⊕{background:#dbeafe;color:#1d4ed8}
.id-⊖{background:#fee2e2;color:#991b1b}
.id-derived{background:#ede9fe;color:#5b21b6}
.tag-derived{background:#f5f3ff;color:#6d28d9}
.eng-def{font-family:Georgia,serif;font-style:italic;font-size:12px;color:#64748b;margin:2px 0 4px 26px}
.vw-note{position:relative;margin:8px 0 4px 8px;padding:8px 10px 8px 42px;background:linear-gradient(135deg,#eef2ff,#f8fafc);
  border:1px solid #e0e7ff;border-radius:8px;font-size:12.5px;color:#334155}
.note-badge{position:absolute;left:8px;top:8px;background:#2563eb;color:#fff;font-size:11px;font-weight:700;
  padding:2px 6px;border-radius:5px}
.note-title{font-weight:700;color:#1e3a8a;margin-bottom:3px}
.note-line{margin:2px 0;line-height:1.5}
/* 不同蓝底标签框的专属配色（贴近书本：高考链接为醒目蓝框） */
.vw-note.note-高考链接{background:linear-gradient(135deg,#e0edff,#eef4ff);border-color:#a9c8ef}
.vw-note.note-高考链接 .note-badge{background:#1d4ed8}
.vw-note.note-高考链接 .note-title{color:#1e40af}
.vw-note.note-辨 .note-badge{background:#7c3aed}
.vw-note.note-同 .note-badge{background:#0891b2}
.vw-note.note-反 .note-badge{background:#db2777}
.vw-note.note-句型 .note-badge{background:#ea580c}
.vw-note .note-body .note-line{position:relative}
.word-card[data-derived="1"] .word-name{color:#6d28d9}
.item{margin:3px 0 3px 26px;font-size:13px}
.item .en{font-family:Georgia,serif;font-style:italic;color:#26303d}
.item .zh{color:#5b6675;margin-left:5px}
.item.src-wrap .src{font-size:10px;color:var(--accent);background:#fff1f2;padding:0 5px;border-radius:5px;margin-left:5px}
.gloss{color:var(--muted);font-size:11px}
.kind{font-size:9px;color:#94a3b8;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:54px;height:54px;stroke:#c3ccda;margin-bottom:12px}

/* ---------- 设置页 ---------- */
.settings{background:var(--card);border-radius:14px;padding:6px 15px;box-shadow:var(--shadow)}
.field{padding:13px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field .desc{font-size:11px;color:var(--muted);margin-top:4px}
.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-size:13px;font-family:inherit;outline:none;background:#fafbfd}
.field input:focus{border-color:var(--primary)}
.switch-row{display:flex;align-items:center;justify-content:space-between}
.switch{position:relative;width:46px;height:26px;background:#cbd5e1;border-radius:20px;
  cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;
  border-radius:50%;transition:.2s}
.switch.on i{left:23px}
.save-bar{margin-top:16px;text-align:center}
.status-line{font-size:12px;margin-top:10px;text-align:center;min-height:18px}
.status-line.ok{color:var(--green)} .status-line.err{color:var(--accent)}
.about{margin-top:18px;font-size:11px;color:var(--muted);line-height:1.8;text-align:center}
.about code{background:#e8ecf3;padding:1px 5px;border-radius:4px;font-size:10px}

/* ---------- 底部导航（手机端） ---------- */
nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--tabbar-h);
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(16px) saturate(125%);backdrop-filter:blur(16px) saturate(125%);
  box-shadow:0 -2px 18px rgba(70,115,160,.12);border-top:1px solid var(--line);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{position:relative;flex:1;border:none;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;
  font-family:inherit;cursor:pointer;min-height:56px}
.bottom-nav button.active{color:var(--primary);font-weight:800}
.bottom-nav button.active::before{content:"";position:absolute;top:0;width:30px;height:3px;
  border-radius:0 0 4px 4px;background:var(--primary)}
.bottom-nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.badge-count{position:absolute;top:6px;left:50%;margin-left:4px;background:var(--accent);
  color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;
  display:none;align-items:center;justify-content:center;padding:0 4px;line-height:1;
  border:2px solid #fff}
.badge-count.show{display:flex}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);
  background:#1f2733;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 批量扫描 ---------- */
.batch-list{margin-top:14px}
.batch-item{background:var(--card);border-radius:11px;padding:10px 12px;margin-bottom:8px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.batch-thumb{width:42px;height:52px;object-fit:cover;border-radius:6px;background:#eef1f5;flex-shrink:0}
.batch-info{flex:1;min-width:0}
.batch-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batch-status{font-size:11px;color:var(--muted);margin-top:2px}
.batch-status.pending{color:#94a3b8}
.batch-status.uploading{color:#2563eb}
.batch-status.parsing{color:#9333ea}
.batch-status.done{color:var(--green)}
.batch-status.error{color:var(--accent)}
.batch-status.retry{cursor:pointer;text-decoration:underline}
.batch-status.recorded{color:#64748b;font-weight:600}
.batch-del{border:none;background:#f1f5f9;color:#94a3b8;width:24px;height:24px;
  border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;line-height:1}
.batch-head{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 4px}
.batch-head b{font-size:13px}
.batch-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini-spinner{display:inline-block;width:11px;height:11px;border:2px solid #d8b4fe;
  border-top-color:#9333ea;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.boundary-note{background:#f0fdf4;border-left:3px solid var(--green);padding:6px 10px;
  font-size:11px;color:#166534;margin-top:4px;border-radius:4px}
.boundary-note.partial{background:#fffbeb;border-left-color:#f59e0b;color:#92400e}
.boundary-note.recorded{background:#f1f5f9;border-left-color:#94a3b8;color:#475569}
.boundary-note.done{background:#f0fdf4;border-left-color:var(--green);color:#166534;font-weight:600}
.pg-wrap{display:inline-flex;align-items:center;gap:2px;background:#eef2ff;color:#4338ca;
  font-size:11px;font-weight:700;padding:1px 4px 1px 6px;border-radius:6px}
.pg-input{width:34px;border:none;background:transparent;color:#4338ca;font-size:12px;
  font-weight:700;padding:0;text-align:center;outline:none;-moz-appearance:textfield}
.pg-input::-webkit-inner-spin-button,.pg-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pg-tag{background:#eef2ff;color:#4338ca;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px}
.partial-tag{font-size:10px;color:#b45309;background:#fef3c7;padding:1px 6px;border-radius:6px;
  white-space:nowrap;font-weight:600}
.last-progress{color:var(--muted);font-size:11.5px;margin:2px 2px 4px;text-align:left;padding-left:2px}
/* 扫描进度提示弹框 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;
  align-items:center;justify-content:center;z-index:100;padding:24px}
.modal-mask.show{display:flex}
.modal{background:var(--card);width:100%;max-width:340px;border-radius:16px;padding:22px 20px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{width:46px;height:46px;border-radius:50%;background:#eff6ff;display:flex;
  align-items:center;justify-content:center;margin:0 auto 12px;color:#2563eb}
.modal-icon svg{width:26px;height:26px}
.modal-title{font-size:17px;font-weight:800;text-align:center;color:#1e293b;margin-bottom:8px}
.modal-highlight{color:#dc2626;font-weight:800}
.modal-desc{font-size:12.5px;color:var(--muted);line-height:1.7;text-align:center;margin-bottom:16px}
.modal-choices{display:flex;flex-direction:column;gap:9px}
.modal-choice{border:1.5px solid #e2e8f0;background:#fff;border-radius:11px;padding:11px 13px;
  text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px}
.modal-choice:active{transform:scale(.98)}
.modal-choice.primary{border-color:#2563eb;background:#eff6ff}
.modal-choice.repeat{border-color:#f59e0b;background:#fffbeb}
.modal-choice b{display:block;font-size:13.5px;color:#1e293b}
.modal-choice small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.modal-choice .ci{font-size:20px;flex-shrink:0}
.modal-cancel{text-align:center;font-size:12px;color:var(--muted);margin-top:13px;cursor:pointer;padding:6px}

/* ---------- 自定义相机（连续拍照） ---------- */
.cam-mask{position:fixed;inset:0;background:#000;display:none;z-index:120;
  flex-direction:column}
.cam-mask.show{display:flex}
.cam-top{position:absolute;top:0;left:0;right:0;z-index:3;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(rgba(0,0,0,.55),transparent)}
.cam-count{color:#fff;font-size:13px;font-weight:700;background:rgba(0,0,0,.4);
  padding:5px 11px;border-radius:12px}
.cam-close{border:none;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;
  border-radius:50%;font-size:19px;cursor:pointer;line-height:1}
#camVideo{width:100%;height:100%;object-fit:cover;display:block}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.cam-flash.flash{animation:camflash .28s ease-out}
@keyframes camflash{0%{opacity:.75}100%{opacity:0}}
.cam-bottom{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;
  flex-direction:column;align-items:center;gap:12px}
.cam-status{color:#e8ecf3;font-size:12px;text-align:center}
.cam-shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;
  background:rgba(255,255,255,.25);cursor:pointer;position:relative;transition:.12s}
.cam-shutter:active{transform:scale(.92)}
.cam-shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.cam-done{border:none;background:rgba(255,255,255,.2);color:#fff;font-size:13px;
  font-weight:700;padding:9px 26px;border-radius:20px;cursor:pointer;font-family:inherit}
.cam-done:active{transform:scale(.97)}

/* ---------- 单页操作按钮 ---------- */
.batch-run{border:none;background:var(--primary-l);color:var(--primary);font-size:12px;
  font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;flex-shrink:0}
.batch-run:active{transform:scale(.95)}
.batch-run.retry{background:#fee2e2;color:#b91c1c}
.batch-run:disabled{opacity:.5;cursor:not-allowed}

/* ---------- 长按编辑弹框 ---------- */
.editor-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;
  align-items:flex-end;justify-content:center;z-index:110;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.editor-mask.show{display:flex}
.editor-sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;
  max-height:88vh;overflow-y:auto;animation:sheetup .22s ease-out;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 20px 50px rgba(0,0,0,.25)}
@keyframes sheetup{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.editor-head{display:flex;justify-content:space-between;align-items:flex-start;
  padding:18px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.editor-title{font-size:18px;font-weight:800;color:var(--primary-d)}
.editor-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.editor-close{border:none;background:#f1f5f9;color:#64748b;width:30px;height:30px;
  border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
.editor-body{padding:6px 18px}
.ed-field{margin:10px 0}
.ed-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.ed-field input,.ed-field textarea{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fafbfd;resize:vertical}
.ed-field input:focus,.ed-field textarea:focus{border-color:var(--primary)}
.ed-sense-box{background:#fafbf8;border:1px solid #ece2cc;border-radius:9px;padding:8px 11px;margin:8px 0}
.ed-sense-box .ed-sense-hd{font-size:12px;color:#1d3f7a;font-weight:700;margin-bottom:5px}
.tag-picker{padding:6px 18px 12px;border-top:1px solid var(--line)}
.tag-picker-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.tag-picker-chips{display:flex;gap:7px;flex-wrap:wrap}
.tag-opt{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px 13px;
  font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.tag-opt .dot{width:9px;height:9px;border-radius:50%}
.tag-opt.sel{color:#fff;font-weight:700;border-color:transparent}
.tag-opt.sel[data-tag="不会"]{background:#dc2626}
.tag-opt.sel[data-tag="不熟"]{background:#ea580c}
.tag-opt.sel[data-tag="已掌握"]{background:#16a34a}
.tag-opt.sel.custom{background:#7c3aed}
.tag-custom{display:flex;gap:8px;margin-top:10px}
.tag-custom input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px;
  font-size:13px;font-family:inherit;outline:none}
.tag-custom input:focus{border-color:var(--primary)}
.editor-foot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--card)}
.editor-foot .btn{flex:1}

/* ============================================================
   响应式壳层：手机底栏 → 平板/桌面左侧栏
   ============================================================ */
/* 平板及以上（≥768px）隐藏手机底栏，内容去掉底部留白 */
@media (min-width:768px){
  nav.bottom-nav{display:none}
  body{padding-bottom:0}
  .page{padding:20px 24px}
}
/* 桌面（≥1024px）：显示左侧栏，主内容整体右移，卡片玻璃化增强 */
@media (min-width:1024px){
  .sidebar{display:flex}
  body{margin-left:var(--sidebar-w)}
  header{display:none}/* 桌面端品牌与版本移入侧栏，顶部留给扫描框 */
  .page{max-width:none;padding:26px 34px;margin-left:0}
  /* 词库页：搜索工具栏 + 纸张词表 居中限宽，桌面更舒展 */
  #page-words{max-width:960px}
  /* 卡片玻璃质感增强 */
  .version-card,.result-card,.settings,.batch-item,.preview-box,.last-progress{
    background:var(--glass);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(16px) saturate(125%);backdrop-filter:blur(16px) saturate(125%)}
  .words-toolbar{background:rgba(243,248,253,.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  /* 桌面端编辑弹框改为居中 Dialog */
  .editor-mask{align-items:center}
  .editor-sheet{max-width:560px;border-radius:20px}
  @keyframes sheetup{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
}
/* 桌面端相机：全屏遮罩改为居中窗口，避免桌面用全屏黑底 */
@media (min-width:768px){
  .cam-mask{background:rgba(15,23,42,.72);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #camVideo{max-width:min(1000px,92vw);height:auto;aspect-ratio:16/9;object-fit:contain;
    margin:auto;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  .cam-top{max-width:min(1000px,92vw);left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0}
  .cam-bottom{max-width:min(1000px,92vw);left:50%;transform:translateX(-50%);border-radius:0 0 16px 16px}
}
/* 手机端降级：关闭毛玻璃，省电防糊（低端机 backdrop-filter 耗电且易糊） */
@media (max-width:767px){
  .upload-zone,.version-card,.result-card,.settings,.batch-item,.preview-box,.last-progress{
    -webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>

<header>
  <h1><span class="brand-mark">V</span>维克多背单词</h1>
  <span id="headerVersion" class="version-mini">v2.6.0</span>
</header>

<!-- ============ 桌面端左侧导航（手机端隐藏） ============ -->
<aside class="sidebar">
  <div class="side-brand"><span class="brand-mark">V</span>维克多背单词</div>
  <nav class="side-nav">
    <button class="active" data-page="scan" onclick="switchPage('scan')">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>扫描</span>
    </button>
    <button data-page="words" onclick="switchPage('words')">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>词库</span>
      <i class="side-badge" id="sideBadge">0</i>
    </button>
    <button data-page="settings" onclick="switchPage('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9 2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>设置</span>
    </button>
  </nav>
  <div class="side-foot">维克多背单词 · <b id="sideVersion">v2.6.0</b></div>
</aside>

<!-- ============ 扫描页 ============ -->
<section class="page active" id="page-scan">
  <div class="upload-zone" id="dropZone">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>
    <h2>批量拍摄 / 选择页面</h2>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="openScanPrompt('file')">选择多张图片</button>
      <button class="btn btn-ghost" onclick="openScanPrompt('camera')">拍照</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </div>

  <div class="last-progress" id="lastProgress">读取扫描进度…</div>

  <div class="batch-head" id="batchHead" style="display:none">
    <b id="batchCount">已选 0 页</b>
    <button class="btn btn-ghost btn-sm" onclick="clearBatch()">清空</button>
  </div>
  <div class="batch-list" id="batchList"></div>

  <div class="batch-actions" id="batchActions" style="display:none">
    <button class="btn btn-accent" id="autoBtn" onclick="autoRunAll()">🚀 开始识别并入库（统一提交）</button>
  </div>

  <div class="progress" id="progressBox">
    <div class="progress-bar"><i id="progressBar"></i></div>
    <div class="progress-label" id="progressLabel">准备中…</div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-head">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>
      批量拆解入库完成
    </div>
    <div class="result-stats" id="resultStats"></div>
    <div id="boundarySummary"></div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">识别词条（去重）：</div>
    <div class="chip-list" id="resultChips"></div>
  </div>
</section>

<!-- ============ 词库页（仿书本 · 单列无限滚动） ============ -->
<section class="page" id="page-words">
  <div class="words-toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input type="text" id="searchInput" placeholder="搜索英文单词或中文释义…" oninput="onSearchChange()">
    </div>
    <div class="list-summary" id="listSummary"><b>0</b><span class="frac-sep">/</span>0</div>
  </div>
  <div class="tag-filter" id="tagFilter"></div>
  <div id="wordList" class="book-list"></div>
  <div id="scrollSentinel" class="scroll-sentinel"><span class="mini-spinner"></span> 加载更多…</div>
</section>

<!-- ============ 设置页 ============ -->
<section class="page" id="page-settings">
  <div class="settings">
    <div class="field">
      <label>Supabase Project URL</label>
      <input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co">
    </div>
    <div class="field">
      <label>Supabase anon / public key</label>
      <input type="password" id="cfgKey" placeholder="eyJhbGciOi…">
    </div>
    <div class="field">
      <label>书名（book_id）</label>
      <input type="text" id="cfgBook" value="victor" placeholder="victor">
    </div>
    <div class="field">
      <div class="switch-row">
        <label style="margin:0">演示模式</label>
        <div class="switch on" id="demoSwitch" onclick="toggleDemo()"><i></i></div>
      </div>
    </div>
  </div>
  <div class="save-bar">
    <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
    <button class="btn btn-ghost" onclick="testConnection()">测试连接</button>
  </div>
  <div class="status-line" id="statusLine"></div>

  <div class="version-card" id="versionCard">
    <div class="version-head" onclick="toggleChangelog()">
      <span class="version-badge" id="versionBadge">v2.6.0</span>
      <span class="version-date" id="versionDate">2026-11-17 更新</span>
      <span class="version-toggle" id="versionToggle">历史版本 ▾</span>
    </div>
    <div class="version-latest" id="versionLatest"></div>
    <div class="version-history" id="versionHistory"></div>
  </div>
</section>

<nav class="bottom-nav">
  <button class="active" data-page="scan" onclick="switchPage('scan')">
    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>扫描</span>
  </button>
  <button data-page="words" onclick="switchPage('words')">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>词库</span>
    <i class="badge-count" id="navBadge">0</i>
  </button>
  <button data-page="settings" onclick="switchPage('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span>设置</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<!-- 扫描进度提示弹框 -->
<div class="modal-mask" id="scanPrompt" onclick="if(event.target===this)closeScanPrompt()">
  <div class="modal">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>
    <div class="modal-title" id="spTitle">上次扫描进度</div>
    <div class="modal-desc" id="spDesc"></div>
    <div class="modal-choices" id="spChoices"></div>
    <div class="modal-cancel" onclick="closeScanPrompt()">取消，暂不扫描</div>
  </div>
</div>

<!-- 自定义相机（连续拍照） -->
<div class="cam-mask" id="cameraModal">
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="cam-flash" id="camFlash"></div>
  <div class="cam-top">
    <span class="cam-count" id="camCount">本次已拍 0 张 · 队列 0/15</span>
    <button class="cam-close" onclick="closeCamera()" aria-label="关闭相机">×</button>
  </div>
  <div class="cam-bottom">
    <div class="cam-status" id="camStatus">正在打开相机…</div>
    <button class="cam-shutter" onclick="snapPhoto()" aria-label="拍照"></button>
    <button class="cam-done" onclick="closeCamera()">完成，返回列表</button>
  </div>
</div>

<!-- 长按编辑弹框 -->
<div class="editor-mask" id="editorModal" onclick="if(event.target===this)closeEditor()">
  <div class="editor-sheet">
    <div class="editor-head">
      <div>
        <div class="editor-title" id="edTitle">编辑词条</div>
        <div class="editor-sub" id="edMeta"></div>
      </div>
      <button class="editor-close" onclick="closeEditor()">×</button>
    </div>
    <div class="editor-body" id="edBody"></div>
    <div class="tag-picker">
      <div class="tag-picker-label">学习标签（点击切换）</div>
      <div class="tag-picker-chips" id="edTagChips"></div>
      <div class="tag-custom">
        <input type="text" id="edCustomTag" placeholder="自定义标签，回车添加" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomTag()}">
        <button class="btn btn-ghost btn-sm" onclick="addCustomTag()">添加</button>
      </div>
    </div>
    <div class="editor-foot">
      <button class="btn btn-ghost" onclick="closeEditor()">取消</button>
      <button class="btn btn-primary" onclick="saveEditor(this)">保存</button>
    </div>
  </div>
</div>

<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
